<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Pipeline: Preflight, Read, Reproduce, Branch, Plan, Fix, Verify, Ship, Report. You approve between every step. Only Ship and Report leave your machine.">
  <style>
    .n{fill:#ffffff;stroke:#c9d4df;stroke-width:1.5}
    .t{font:700 13px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0b1f33}
    .k{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8796a5}
    .g{fill:#d9480f}
    .gl{font:700 9px ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif;fill:#fff}
    .ln{stroke:#c9d4df;stroke-width:1.5}
    .out{fill:#fff4ec;stroke:#d9480f;stroke-width:1.5}
    .cap{font:600 12px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#52606d}
    @media (prefers-color-scheme: dark){
      .n{fill:#0d1722;stroke:#2b3b4c}.t{fill:#e6edf3}.k{fill:#6b7d8f}.ln{stroke:#2b3b4c}
      .out{fill:#2a1608;stroke:#ff7a3d}.g{fill:#ff7a3d}.cap{fill:#9aa7b4}
    }
  </style>
  <line class="ln" x1="40" y1="80" x2="860" y2="80"/>
  <g id="steps">
    <g transform="translate(10 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">0</text><text class="t" x="39" y="40" text-anchor="middle">Preflight</text></g>
    <g transform="translate(108 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">1</text><text class="t" x="39" y="40" text-anchor="middle">Read</text></g>
    <g transform="translate(206 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">2</text><text class="t" x="39" y="40" text-anchor="middle">Reproduce</text></g>
    <g transform="translate(304 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">3</text><text class="t" x="39" y="40" text-anchor="middle">Branch</text></g>
    <g transform="translate(402 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">4</text><text class="t" x="39" y="40" text-anchor="middle">Plan</text></g>
    <g transform="translate(500 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">5</text><text class="t" x="39" y="40" text-anchor="middle">Fix</text></g>
    <g transform="translate(598 52)"><rect class="n" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">6</text><text class="t" x="39" y="40" text-anchor="middle">Verify</text></g>
    <g transform="translate(696 52)"><rect class="out" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">7</text><text class="t" x="39" y="40" text-anchor="middle">Ship</text></g>
    <g transform="translate(794 52)"><rect class="out" width="78" height="56" rx="10"/><text class="k" x="39" y="21" text-anchor="middle">8</text><text class="t" x="39" y="40" text-anchor="middle">Report</text></g>
  </g>
  <g>
    <circle class="g" cx="98" cy="80" r="9"/><text class="gl" x="98" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="196" cy="80" r="9"/><text class="gl" x="196" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="294" cy="80" r="9"/><text class="gl" x="294" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="392" cy="80" r="9"/><text class="gl" x="392" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="490" cy="80" r="9"/><text class="gl" x="490" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="588" cy="80" r="9"/><text class="gl" x="588" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="686" cy="80" r="9"/><text class="gl" x="686" y="83.5" text-anchor="middle">✓</text>
    <circle class="g" cx="784" cy="80" r="9"/><text class="gl" x="784" y="83.5" text-anchor="middle">✓</text>
  </g>
  <text class="cap" x="98" y="30"><tspan class="g">●</tspan> = you approve. Every step, every time.</text>
  <text class="cap" x="216" y="140" text-anchor="middle">bug not reproduced? stop here, no branch</text>
  <path class="ln" d="M245 112 L245 124" />
  <text class="cap" x="784" y="140" text-anchor="middle">only these two leave your machine,</text>
  <text class="cap" x="784" y="158" text-anchor="middle">with the exact text shown first</text>
</svg>
